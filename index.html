<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OpenTap Stadium</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2244%22 fill=%22%23FF5A36%22/><circle cx=%2250%22 cy=%2250%22 r=%2220%22 fill=%22%23FAF6F0%22/></svg>">
    <link rel="stylesheet" href="style.css">
    
    <!-- External Libraries -->
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.0/lib/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div id="app-layer">
        <header id="main-header">
            <div class="logo">
                <span class="logo-dot"></span>
                OpenTap Stadium
            </div>
            <button id="settings-btn" class="icon-btn">Players Config</button>
        </header>

        <main id="hub-grid">
            <!-- Injected by main.js -->
        </main>

        <!-- WII-STYLE INTERACTIVE PLAYER LOUNGE -->
        <div id="setup-overlay" class="overlay hidden">
            <div class="plaza-container">
                <div class="plaza-header">
                    <div class="plaza-header-left">
                        <h2>Player Lounge</h2>
                        <span class="plaza-subtitle">Click an avatar to customize</span>
                    </div>
                    <div class="plaza-controls">
                        <div id="lobby-settings-container"></div>
                        <button id="add-player-btn" class="secondary-btn">Add Local Player</button>
                        <button id="save-players-btn" class="primary-btn">Start Playing</button>
                    </div>
                </div>

                <!-- Full Interactive Wandering Stage -->
                <div class="plaza-stage-wrapper">
                    <div id="plaza-canvas-container"></div>
                </div>
            </div>

            <!-- FOCUSED SINGLE PLAYER CUSTOMIZATION MODAL -->
            <div id="player-editor-modal" class="hidden">
                <div class="editor-modal-card">
                    <div class="editor-header">
                        <h3 id="editor-title">Customize Player</h3>
                        <button id="close-editor-btn" class="editor-close-btn">&times;</button>
                    </div>
                    <div class="editor-body">
                        <div class="editor-preview-box">
                            <div id="editor-preview-target"></div>
                        </div>
                        <div class="editor-controls">
                            <label class="editor-label">Name</label>
                            <input type="text" id="editor-name-input" class="editor-input" maxlength="12">
                            
                            <label class="editor-label">Color Hue</label>
                            <input type="range" id="editor-hue-slider" class="hue-slider" min="0" max="360">
                            
                            <div class="editor-btn-row">
                                <button id="editor-style-btn" class="setup-btn">Style: Boy</button>
                                <button id="editor-acc-btn" class="setup-btn">Accessory: Bear Ears</button>
                            </div>
                            
                            <div class="editor-actions">
                                <button id="editor-del-btn" class="del-btn hidden">Remove Player</button>
                                <button id="editor-done-btn" class="primary-btn editor-done-btn">Done</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ATTRACT MODE LAYER -->
    <div id="attract-layer" class="hidden">
        <div id="attract-canvas-container"></div>
        <div class="attract-overlay-content">
            <div class="attract-logo">OPENTAP STADIUM</div>
            <div class="attract-cta">PRESS ANY KEY TO START</div>
            <div id="attract-game-title">Sumo Discs</div>
            <div class="attract-qr-container">
                <p>Scan to Join</p>
                <div id="attract-qr-target"></div>
            </div>
        </div>
    </div>

    <div id="game-stage" class="hidden">
        <div id="game-canvas-container"></div>
        <div id="game-ui-layer">
            <div id="ui-top-bar">
                <button id="back-to-hub-btn" class="small-btn">Exit Game</button>
                <div id="ui-scoreboard"></div>
            </div>
        </div>
    </div>

    <div id="ui-center-message"></div>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
